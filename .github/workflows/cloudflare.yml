# Veröffentlicht die App und den Stimmen-Worker bei Cloudflare.
# Braucht das GitHub-Secret CLOUDFLARE_API_TOKEN (Vorlage „Edit Cloudflare Workers“),
# optional CLOUDFLARE_ACCOUNT_ID. Ohne Token wird nichts getan.
name: Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Token vorhanden?
        if: env.HAT_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN fehlt, Cloudflare wird übersprungen."
      - uses: actions/checkout@v6
        if: env.HAT_TOKEN == 'true'
      - name: workers.dev-Adresse sicherstellen
        if: env.HAT_TOKEN == 'true'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API=https://api.cloudflare.com/client/v4
          [ -n "$ACC" ] || ACC=$(curl -s -H "Authorization: Bearer $T" $API/accounts | jq -r '.result[0].id')
          echo "Konto: ${ACC:0:6}…"
          cur=$(curl -s -H "Authorization: Bearer $T" $API/accounts/$ACC/workers/subdomain | jq -r '.result.subdomain // empty')
          if [ -z "$cur" ]; then
            for n in schatzsuche-app schatzsuche-app-$RANDOM; do
              r=$(curl -s -X PUT -H "Authorization: Bearer $T" -H 'Content-Type: application/json' $API/accounts/$ACC/workers/subdomain -d "{\"subdomain\":\"$n\"}")
              if echo "$r" | jq -e .success >/dev/null; then cur=$n; break; fi
              echo "$r" | jq -c '.errors'
            done
          fi
          echo "::notice::workers.dev-Adresse: ${cur}.workers.dev"
      - name: Impressum-Angaben einsetzen
        if: env.HAT_TOKEN == 'true'
        env:
          NAME: ${{ secrets.IMPRESSUM_NAME }}
          ANSCHRIFT: ${{ secrets.IMPRESSUM_ANSCHRIFT }}
          EMAIL: ${{ secrets.IMPRESSUM_EMAIL }}
        run: |
          # Angaben stehen nur in GitHub-Secrets, nicht im öffentlichen Repo. Ohne Secret bleibt der Hinweis „Angaben folgen“.
          [ -n "$NAME" ] || { echo "::warning::IMPRESSUM_NAME fehlt"; exit 0; }
          python3 - <<'PY'
          import os, html
          w={'{{IMPRESSUM_NAME}}':os.environ['NAME'], '{{IMPRESSUM_ANSCHRIFT}}':os.environ.get('ANSCHRIFT',''), '{{IMPRESSUM_EMAIL}}':os.environ.get('EMAIL','')}
          for f in ['app/impressum.html','app/datenschutz.html']:
              s=open(f,encoding='utf-8').read()
              for k,v in w.items(): s=s.replace(k, html.escape(v).replace('\n','<br>'))
              open(f,'w',encoding='utf-8').write(s)
          PY
      - name: Version in die Fehlermeldungen schreiben
        if: env.HAT_TOKEN == 'true'
        run: sed -i "s/__VERSION__/${GITHUB_SHA::7}/" app/fehler.js
      - name: App veröffentlichen
        if: env.HAT_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.158.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Stimmen- und Karten-Worker veröffentlichen
        if: env.HAT_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          W="npx --yes wrangler@4.158.0"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || export CLOUDFLARE_ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          $W deploy --config worker/wrangler.toml
          $W deploy --config worker/karte.toml
          $W deploy --config worker/umleitung.toml
          if [ -n "$ELEVENLABS_API_KEY" ]; then printf '%s' "$ELEVENLABS_API_KEY" | $W secret put ELEVENLABS_API_KEY --config worker/wrangler.toml; fi
          # Aufräumen: ein früherer Lauf hat den Schlüssel versehentlich an den App-Worker gehängt
          yes | $W secret delete ELEVENLABS_API_KEY --name schnitzeljagd-app 2>/dev/null || true
