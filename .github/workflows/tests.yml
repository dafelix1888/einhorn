# Browser-Tests (Playwright) bei jedem Pull Request und auf main.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Seite lokal starten
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/app/ >/dev/null && break; sleep 0.5; done
      - name: Tests
        env:
          TZ: Europe/Berlin
        run: node tests/alle.cjs
