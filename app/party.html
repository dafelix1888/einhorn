<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="robots" content="noindex"><script src="fehler.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0B17">
<title>Party planen · Schatzweg</title>
<link rel="stylesheet" href="dunkel.css">
<style>
.kopf{display:flex;gap:14px;align-items:center;margin:4px 0 16px}
.kopf img{width:72px;height:72px;border-radius:50%;border:3px solid #E8C26A;flex:0 0 auto;object-fit:cover;background:var(--karte)}
.kopf h1{font-size:1.5rem;margin:0}
.kopf .leise{font-size:.95rem}
.kopf .countdown{margin-left:auto;background:var(--akzent);color:#160C2B;font-weight:800;border-radius:999px;padding:4px 10px;font-size:.85rem;white-space:nowrap;align-self:flex-start}
.stapel{display:flex;flex-direction:column;gap:14px}
.teile{list-style:none;margin:-4px 0 14px;padding:0;display:grid;gap:6px}
.teile li{display:flex;gap:10px;align-items:center;font-size:.95rem;color:#D9D2E8}
.teile .punkt{width:22px;height:22px}
.teile .punkt svg{width:13px;height:13px}
.teile .uhr{color:var(--akzent);font-weight:800;min-width:3.2em}
.reihe .neben{margin-left:4px}
.plan{list-style:none;margin:0;padding:0}
.plan>li{padding:0}
.plan .haken{width:44px;height:44px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
.plan .wann{color:var(--leise);font-size:.8rem;white-space:nowrap}
.plan .wann.faellig{color:var(--gelb);font-weight:700}
.ding{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--linie)}
.ding input{width:24px;height:24px;accent-color:var(--gruen)}
.ding .menge{font-weight:800;color:var(--akzent)}
.ding span{color:var(--leise);font-size:.88rem}
.ding.fertig label{opacity:.6}
.punkt-ok{width:22px;height:22px;border-radius:50%;background:var(--gruen);display:block}
.erledigt-liste{margin-top:8px}
.erledigt-liste summary{cursor:pointer;color:var(--leise);font-weight:700;padding:10px 0;min-height:44px;display:flex;align-items:center}
.planb{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ueberblick{background:var(--panel);border-radius:18px;padding:14px 14px 8px;margin-bottom:18px}
.ueberblick-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ueberblick-kopf h2{margin:0;font-size:1.15rem}.ueberblick-kopf b{font-size:.85rem;color:var(--leise);white-space:nowrap}
.ueberblick .bahn{margin:10px 0 8px}.ueberblick>p.leise{font-size:.9rem;margin:0 0 6px}
.ueberblick .fertig-karte{margin:8px 0}
.ueberblick #kalender{margin:10px 0 4px;font-size:.9rem}
.schritt{border-top:1px solid var(--linie)}
.schritt-kopf{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center}
.schritt.auf>.schritt-kopf{position:sticky;top:0;z-index:2;background:var(--panel);box-shadow:0 6px 10px -8px rgba(0,0,0,.6)}
.oeffnen{display:grid;grid-template-columns:1fr auto 14px;gap:8px;align-items:center;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:8px 0;min-height:52px;cursor:pointer;width:100%}
.oeffnen .titel b{display:block}
.oeffnen .kurz{color:var(--leise);font-size:.88rem;display:block}
.dran-marke{font-style:normal;font-weight:800;color:var(--akzent)}
.oeffnen .pfeil{width:9px;height:9px;border-right:2px solid var(--leise);border-bottom:2px solid var(--leise);transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
.schritt.auf .oeffnen .pfeil{transform:rotate(-135deg);margin-top:4px}
.schritt.fertig:not(.auf) .oeffnen b{color:var(--leise);text-decoration:line-through}
.inhalt{padding:2px 0 14px 50px}
.inhalt>p:first-child{margin:0 0 12px;color:#D9D2E8}
.teile small{display:block;color:var(--leise);font-size:.82rem}
.werkzeug{margin:0 0 14px}.werkzeug p{margin:6px 0 0;font-size:.88rem;color:var(--leise)}
.inhalt .route-karte{margin:0 0 14px}
.inhalt .klein,.klein{font-size:.85rem}
.inhalt .karte{margin:0 0 14px}
.inhalt h2{font-size:1.05rem;margin:4px 0 8px}
.schritt-fuss{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:6px;padding-top:12px;border-top:1px dashed var(--linie)}
.blaettern{display:flex;gap:16px;margin-left:auto;font-size:.92rem}
@media (max-width:420px){ .inhalt{padding-left:0} }
.werkzeuge{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.werkzeuge .knopf{width:100%}
.werkzeuge .knopf{padding:10px 12px;font-size:.92rem}
@media (max-width:340px){ .werkzeuge{grid-template-columns:1fr} }
.route-geschafft{display:flex;gap:14px;align-items:center;margin:0 0 20px;padding:12px 14px 12px 10px;border-radius:18px;
  background:radial-gradient(120% 140% at 0% 0%,rgba(167,139,250,.28),rgba(167,139,250,0) 60%),var(--karte);box-shadow:inset 0 0 0 1px rgba(167,139,250,.28);animation:rg-rein .5s cubic-bezier(.2,1.3,.4,1)}
.route-geschafft svg{flex:none;border-radius:12px;background:rgba(15,11,23,.55)}
.route-geschafft b{display:block;font-size:1.15rem;margin:4px 0 2px}.route-geschafft .leise{display:block;font-size:.9rem}
.rg-marke{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.02em;color:#0F2A17;background:var(--gruen);border-radius:999px;padding:2px 9px}
.rg-weg{fill:none;stroke:rgba(255,255,255,.55);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;stroke-linecap:round;stroke-linejoin:round;animation:rg-zeichnen 1.1s .15s ease forwards;vector-effect:non-scaling-stroke}
.rg-p{transform-box:fill-box;transform-origin:center;animation:rg-plopp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes rg-zeichnen{to{stroke-dashoffset:0}}@keyframes rg-plopp{from{transform:scale(0)}}@keyframes rg-rein{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){.route-geschafft,.rg-p,.rg-weg{animation:none;stroke-dashoffset:0}}
/* Assistent */
.feld{display:block;margin:0}
.feld span{display:block;font-weight:700;margin-bottom:6px}
.zaehlzeile{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--karte);border-radius:14px;padding:10px 14px}
.zaehlzeile .zaehler button{border:0;background:var(--hover);color:var(--text);font-size:1.4rem}
.zaehlzeile .zaehler b{font-size:1.3rem;min-width:2rem}
.orte{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.orte button{text-align:left;background:var(--karte);border:2px solid var(--linie);border-radius:14px;padding:14px;min-height:44px}
.orte button[aria-pressed=true]{border-color:var(--akzent);background:color-mix(in srgb,var(--akzent) 14%,var(--karte))}
.orte svg{width:26px;height:26px;color:var(--akzent);display:block;margin-bottom:6px}
.orte b{display:block}
.orte span{color:var(--leise);font-size:.85rem}
.vorein{background:var(--karte);border-radius:14px;padding:4px 14px;font-size:.95rem}
.vorein summary{cursor:pointer;padding:10px 0;min-height:44px;list-style:none}
.vorein summary::-webkit-details-marker{display:none}
.vorein summary b{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vorein summary b em{font-style:normal;color:var(--akzent);font-size:.9rem;white-space:nowrap}
.vorein summary span{color:var(--leise);display:block}
.vorein .schalter label{margin:0;font-weight:400;flex:1;cursor:pointer}
.vorein .schalter label b{display:block}
.vorein .schalter label span{color:var(--leise);font-size:.9rem}
.zusammen{background:linear-gradient(130deg,#3B2A64,#1F1929);border-radius:16px;padding:16px 18px}
.zusammen b{font-size:1.2rem}
.zusammen p{margin:4px 0 0;color:var(--leise)}
.summe div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--linie)}
.summe div:first-child{border-top:0}
.summe span{color:var(--leise)}
.summe b{text-align:right}
.route-karte{display:flex;gap:16px;align-items:center;background:var(--karte);border-radius:16px;padding:14px;margin:14px 0 4px}
.route-karte svg{width:150px;height:100px;flex:0 0 auto;background:#120E1A;border-radius:10px}
.route-karte b{font-size:1.1rem}
.route-karte p{margin:4px 0 10px;font-size:.92rem}
@media (max-width:420px){ .route-karte svg{width:110px;height:76px} }
.einladung-felder textarea{font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--linie);border-radius:12px;padding:10px 12px;width:100%;resize:vertical}
.ersatz-hinweis{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:rgba(245,158,11,.12);font-size:.92rem}
</style></head><body>
<main class="seite" id="seite"><p class="leise">Lädt …</p></main>
<div class="toast" id="toast" hidden></div>
<script src="planer-kern.js"></script>
<script src="party.js"></script>
<script src="weg.js"></script>
<script src="konto.js"></script>
<script src="namen.js"></script>
<script>
(function(){
  'use strict';
  var q=new URLSearchParams(location.search), thema=(q.get('thema')||'einhorn').replace(/[^a-z0-9-]/gi,'');
  var tour=null, info=null, party=null, entwurf=null, schritt=0, vgVonHand=false, voreinOffen=false;
  // offener Schritt der Übersicht: aus der Adresse (#einkauf, #einladung, #s-route …), sonst der nächste offene
  var offen=(function(h){ return {einkauf:'bestellen', einladung:'einladen'}[h] || (/^s-[a-z]+$/.test(h)?h.slice(2):null); })(location.hash.slice(1));
  var SCHRITTE=3;
  var HAKEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var BAUM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0-5.6 8.2A4.5 4.5 0 0 0 9 19h6a4.5 4.5 0 0 0 2.6-7.8A6 6 0 0 0 12 3z"/><path d="M12 13v8"/></svg>';
  var HAUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>';
  function $(id){ return document.getElementById(id); }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(t){ var e=$('toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){ e.hidden=true; }, 3200); }
  function heute(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function genitiv(n){ return /[sßxz]$/i.test(n) ? n+'’' : n+'s'; }
  function partyTitel(p){ return p.kind && p.kind.name ? genitiv(p.kind.name)+' Einhorn-Party' : 'Eure Einhorn-Party'; }
  function tageAb(d){ var h=new Date(); h.setHours(0,0,0,0); var x=new Date(d); x.setHours(0,0,0,0); return Math.round((x-h)/864e5); }
  function kurzDatum(d){ return d.toLocaleDateString('de-DE',{day:'numeric', month:'numeric'}); }
  // wann ein Schritt dran ist, kurz und ohne Datum, wo es geht
  function wann(a){
    var t=tageAb(a.datum);
    if(a.tag===0) return t===0?'heute':t===1?'morgen':kurzDatum(a.datum);
    if(t<0) return a.fertig?kurzDatum(a.datum):'fällig';
    if(t===0) return 'heute'; if(t===1) return 'morgen';
    if(a.tag===-1 && t<7) return 'am Vortag';
    if(t<7) return 'in '+t+' Tagen';
    var w=Math.floor(t/7); return 'in '+w+(w===1?' Woche':' Wochen');
  }

  // ---------- Assistent (3 Schritte) ----------
  function ortText(e){ return e.ort==='drinnen' ? 'drinnen' : 'draußen'+(e.planB?', Plan B drinnen':''); }
  function voreinText(e){
    var l=[];
    if(e.ort==='draussen'){ l.push(e.planB?'Plan B bei Regen an':'Ohne Plan B'); l.push(e.ausdrucke!==false?'Mit Ausdrucken':'Ohne Ausdrucke'); }
    l.push(e.helfer<2?'Alles wird vorher aufgebaut':e.vorausgeher?'Ein Erwachsener geht voraus':'Kein Vorausgeher');
    return l.join(' · ');
  }
  // Übergabe vom Planer: kleine Regenbogen-Karte der geplanten Route
  var REGENBOGEN=['#E5484D','#F59E0B','#F2C94C','#3FB950','#3B82F6','#6366F1','#8B5CF6'];
  function routeGeschafft(pl){
    var st=pl.stationen, k=Math.cos(st[0].lat*Math.PI/180), xs=st.map(function(p){ return p.lng*k; }), ys=st.map(function(p){ return -p.lat; });
    var x0=Math.min.apply(0,xs), x1=Math.max.apply(0,xs), y0=Math.min.apply(0,ys), y1=Math.max.apply(0,ys), W=128, H=96, r=12;
    var f=Math.min((W-2*r)/Math.max(1e-9,x1-x0), (H-2*r)/Math.max(1e-9,y1-y0));
    var px=st.map(function(p,i){ return [r+(xs[i]-x0)*f+((W-2*r)-(x1-x0)*f)/2, r+(ys[i]-y0)*f+((H-2*r)-(y1-y0)*f)/2]; });
    var weg=px.map(function(q,i){ return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1); }).join(' ')+(pl.rundkurs===true?' Z':'');
    var punkte=px.map(function(q,i){ return i===0 ? '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="7" fill="#fff"/><path d="M'+(q[0]-3.5).toFixed(1)+' '+(q[1]+3).toFixed(1)+'v-3.6l3.5-3 3.5 3v3.6z" fill="#7C5BD6"/>' :
      '<circle class="rg-p" style="animation-delay:'+(0.25+i*0.12).toFixed(2)+'s" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="5.5" fill="'+REGENBOGEN[(i-1)%7]+'" stroke="#17121F" stroke-width="2"/>'; }).join('');
    var km=pl.strecke ? (pl.strecke/1000).toFixed(1).replace('.',',')+' km' : '';
    return '<div class="route-geschafft"><svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true"><path class="rg-weg" d="'+weg+'" pathLength="1"/>'+punkte+'</svg>'+
      '<div><span class="rg-marke">✓ Route gespeichert</span><b>Eure Tour steht</b><span class="leise">'+(st.length-1)+' Stationen'+(km?' · '+km:'')+'</span><span class="leise">Jetzt noch kurz zur Party.</span></div></div>';
  }
  function assistent(){
    var e=entwurf, zurueck=schritt>0 ? '<button type="button" class="textknopf" id="zurueck">← Zurück</button>' :
      (party ? '<a class="textknopf" href="party.html?thema='+thema+'">← Zur Party</a>'
             : '<a class="textknopf" href="'+(Weg.plan(thema)?'planer.html?thema='+thema:'landing.html')+'" data-zurueck="'+(Weg.plan(thema)?'planer.html?thema='+thema:'landing.html')+'">← Zurück</a>');
    var h='<div class="oben">'+zurueck+'<span class="leise">Schritt '+(schritt+1)+' von '+SCHRITTE+'</span></div>'+
      '<div class="fortschritt">'+[0,1,2].map(function(i){ return '<i class="'+(i<=schritt?'an':'')+'"></i>'; }).join('')+'</div><div class="stapel">';
    if(schritt===0){
      var pl0=Party.plan(thema), mitRoute=!party && pl0 && pl0.stationen && pl0.stationen.length>1;
      h+=(mitRoute?routeGeschafft(pl0):'')+'<h1>Für wen und wann?</h1>'+
        '<label class="feld"><span>Vorname</span><input id="name" type="text" autocomplete="off" value="'+esc(e.kind.name)+'" placeholder="z. B. Emma"></label>'+
        '<div class="zwei"><label class="feld"><span>Wird</span><input id="alter" type="number" min="2" max="12" inputmode="numeric" value="'+esc(e.kind.alter||'')+'" placeholder="5"></label>'+
        '<label class="feld"><span>Start</span><input id="start" type="time" step="900" value="'+esc(e.start||'15:00')+'"></label></div>'+
        '<label class="feld"><span>Datum</span><input id="datum" type="date" min="'+heute()+'" value="'+esc(e.datum||'')+'"></label>'+
        '<p class="leise" style="font-size:.92rem">Die Jagd dauert etwa '+tour.dauer.minuten+' Minuten. Name und Alter stehen auf Einladung und Urkunden. Der Name bleibt auf diesem Gerät.</p>';
    } else if(schritt===1){
      var d=e.ort==='draussen';
      h+='<h1>Wer ist dabei, wo spielt ihr?</h1>'+
        '<div class="zaehlzeile"><b>Kinder</b><div class="zaehler"><button type="button" data-z="kinder" data-d="-1" aria-label="Weniger Kinder">–</button><b aria-live="polite">'+e.kinder+'</b><button type="button" data-z="kinder" data-d="1" aria-label="Mehr Kinder">+</button></div></div>'+
        '<div class="zaehlzeile"><b>Erwachsene</b><div class="zaehler"><button type="button" data-z="helfer" data-d="-1" aria-label="Weniger Erwachsene">–</button><b aria-live="polite">'+e.helfer+'</b><button type="button" data-z="helfer" data-d="1" aria-label="Mehr Erwachsene">+</button></div></div>'+
        '<div class="orte"><button type="button" data-ort="draussen" aria-pressed="'+d+'">'+BAUM+'<b>Draußen</b><span>ab der Haustür, mit GPS</span></button>'+
        '<button type="button" data-ort="drinnen" aria-pressed="'+(!d)+'">'+HAUS+'<b>Drinnen</b><span>in der Wohnung</span></button></div>'+
        '<details class="vorein" id="vorein"'+(voreinOffen?' open':'')+'><summary><b>Schon voreingestellt <em>'+(voreinOffen?'Fertig':'Ändern')+'</em></b><span>'+esc(voreinText(e))+'. Alles später änderbar.</span></summary>'+
          (d?'<div class="schalter"><label for="planb"><b>Plan B bei Regen</b><span>Drinnen-Variante mit vorbereiten, am Partytag mit einem Tipp umschalten.</span></label><input type="checkbox" id="planb"'+(e.planB?' checked':'')+'></div>'+
             '<div class="schalter"><label for="ausdrucke"><b>Mit Ausdrucken</b><span>Eine A3-Wolke zum Aufhängen. Ohne: Bilder nur im Spiegel, dafür ein weißes Laken.</span></label><input type="checkbox" id="ausdrucke"'+(e.ausdrucke!==false?' checked':'')+'></div>':'')+
          '<div class="schalter"><label for="vorausgeher"><b>Ein Erwachsener geht voraus</b><span>'+(e.helfer<2?'Geht ab zwei Erwachsenen. Mit nur einem wird alles vorher aufgebaut.':'Baut die Stationen kurz vorher auf. Ohne liegt alles schon vorher bereit.')+'</span></label><input type="checkbox" id="vorausgeher"'+(e.vorausgeher?' checked':'')+(e.helfer<2?' disabled':'')+'></div>'+
        '</details>';
    } else {
      var vName=tour.varianten[Party.variante(e)].name;
      h+='<h1>Fertig! So sieht’s aus</h1>'+
        '<div class="zusammen"><b>'+esc(partyTitel(e))+'</b><p>'+esc(Party.datumText(Party.datum(e)))+', '+esc(e.start)+' Uhr · '+e.kinder+' Kinder · '+esc(ortText(e))+'</p></div>'+
        '<div class="karte summe" style="margin:0">'+
          '<div><span>Geburtstagskind</span><b>'+esc(e.kind.name)+', wird '+esc(e.kind.alter)+'</b></div>'+
          '<div><span>Erwachsene</span><b>'+e.helfer+(e.vorausgeher?', einer geht voraus':'')+'</b></div>'+
          '<div><span>Variante</span><b>'+esc(vName)+'</b></div></div>'+
        '<div class="karte" style="margin:0"><b style="display:block;margin-bottom:6px">Dein Plan: 6 Schritte in 2 Wochen</b><span class="leise" style="font-size:.92rem">Jeden Schritt siehst du genau dann, wenn er dran ist. Was die App selbst erkennt, hakt sie selbst ab.</span></div>';
    }
    h+='</div><div style="margin-top:22px"><button type="button" class="knopf breit" id="weiter">'+(schritt<SCHRITTE-1?'Weiter':party?'Speichern':'Plan erstellen')+'</button></div><p class="fehler" id="fehler" role="alert" style="color:var(--rot);margin-top:10px"></p>';
    $('seite').innerHTML=h;
    var f=$('seite').querySelector('input'); if(f && schritt===0 && !party) try{ f.focus(); }catch(x){}
  }
  function uebernehmen(){                         // Felder des aktuellen Schritts in den Entwurf
    var e=entwurf;
    if(schritt===0){ e.kind.name=$('name').value.trim().replace(/\s+/g,' ').slice(0,30); e.kind.alter=+$('alter').value||null; e.datum=$('datum').value; e.start=$('start').value||'15:00';
      if(!e.kind.name) return 'Bitte den Vornamen eingeben.'; if(!e.kind.alter || e.kind.alter<2 || e.kind.alter>12) return 'Bitte ein Alter zwischen 2 und 12 eingeben.'; if(!e.datum) return 'Bitte ein Datum wählen.'; }
    if(schritt===1){ e.vorausgeher=!!(e.vorausgeher && e.helfer>=2); }
    return '';
  }

  // ---------- Einkauf: Preis je Artikel und Summe ----------
  function einkaufZeile(x){
    var box = x.fertig ? '<span class="punkt-ok" aria-hidden="true"></span>'
