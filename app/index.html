<!doctype html><html lang="de"><head><meta charset="utf-8"><script src="fehler.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0B17">
<title>Schatzweg · Schatzsuchen zum Kindergeburtstag</title>
<style>
:root{--bg:#0F0B17;--panel:#17121F;--karte:#1F1929;--hover:#2A2236;--linie:#2F2740;--text:#F5F2FA;--leise:#B3A9C4;--akzent:#A78BFA;--akzent-tief:#7C5BD6;--gruen:#4ADE80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#000;color:var(--text);font-family:"Avenir Next","Trebuchet MS","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.4;overflow:hidden}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--akzent);outline-offset:2px}
/* Kopf */
.kopf{height:64px;display:flex;align-items:center;gap:12px;padding:8px 16px}
.marke{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;text-decoration:none;flex:0 0 auto}
.marke .logo{width:34px;height:34px;border-radius:50%;background:conic-gradient(#E23A3F,#F2B90F,#3A9D4B,#2B6FE0,#9050C8,#E23A3F);display:grid;place-items:center}
.marke .logo i{width:22px;height:22px;border-radius:50%;background:#0F0B17;display:block}
.mitte{flex:1;display:flex;justify-content:center;gap:8px;min-width:0}
.rund{width:48px;height:48px;border-radius:50%;border:0;background:var(--karte);display:grid;place-items:center;flex:0 0 auto}
.rund:hover{background:var(--hover)}
.profil{width:46px;height:46px;border-radius:50%;border:0;padding:3px;flex:0 0 auto;cursor:pointer;background:conic-gradient(#E23A3F,#F2B90F,#3A9D4B,#2B6FE0,#9050C8,#E23A3F)}
.profil span{width:100%;height:100%;border-radius:50%;background:#0F0B17;display:grid;place-items:center;font-weight:800;font-size:1.05rem;color:var(--text)}
.profil svg{width:20px;height:20px}
.profil:hover span{background:var(--karte)}
.suche{display:flex;align-items:center;gap:10px;background:var(--karte);border-radius:999px;padding:0 18px;height:48px;width:min(480px,100%);min-width:0;border:2px solid transparent}
.suche:focus-within{border-color:var(--leise)}
.suche input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-size:1rem;outline:none;min-width:0}
.suche svg,.rund svg{width:22px;height:22px;flex:0 0 auto}
/* Raster */
.raster{display:grid;grid-template-columns:300px 1fr 320px;gap:8px;padding:0 8px 8px;height:calc(100% - 64px)}
.flaeche{background:var(--panel);border-radius:10px;overflow:auto;min-height:0}
@media (max-width:1180px){ .raster{grid-template-columns:260px 1fr} .jetzt{display:none} }
@media (max-width:820px){ .raster{grid-template-columns:1fr} .bib{display:none} body{overflow:auto} .raster{height:auto} .marke{display:none} .profil{order:-1} }
/* Bibliothek */
.bib{padding:16px 8px}
.bib h2{font-size:1.05rem;margin:0 8px 12px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 8px 14px}
.chip{border:0;background:var(--karte);border-radius:999px;padding:7px 14px;font-size:.92rem}
.chip:hover{background:var(--hover)}
.chip[aria-pressed=true]{background:var(--text);color:#111}
.zeile{display:flex;gap:12px;align-items:center;padding:8px;border-radius:8px;text-decoration:none;width:100%;border:0;background:none;text-align:left}
.zeile:hover{background:var(--hover)}
.zeile img{width:48px;height:48px;border-radius:6px;flex:0 0 auto}
.zeile b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile span{display:block;color:var(--leise);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile .txt{min-width:0}
.leer{color:var(--leise);font-size:.92rem;margin:4px 8px 0;background:var(--karte);border-radius:10px;padding:14px}
.leer b{color:var(--text);display:block;margin-bottom:4px}
/* Start */
.inhalt{padding:20px 24px 40px}
.gruss{font-size:1.9rem;font-weight:800;margin:4px 0 14px}
h2.abschnitt{font-size:1.45rem;margin:30px 0 14px}
.kurzreihe{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.kurz{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;text-decoration:none;font-weight:700;height:64px}
.kurz:hover{background:rgba(255,255,255,.14)}
.kurz img{width:64px;height:64px}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px 18px}
@media (max-width:520px){ .kacheln{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px} .inhalt{padding:16px} }
.kachel{position:relative;text-decoration:none;display:block;padding:10px;margin:-10px;border-radius:10px;min-width:0}
.kachel:hover{background:var(--karte)}
.kachel .bild{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.kachel img{width:100%;height:100%;display:block}
.kachel.bald img{filter:saturate(.55) brightness(.7)}
.kachel h3{font-size:1.05rem;margin:12px 0 4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kachel p{margin:0;color:var(--leise);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.marke-oben{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700}
.marke-oben.frei{background:var(--gruen);color:#062B12}
.spielknopf{position:absolute;right:10px;bottom:10px;width:52px;height:52px;border-radius:50%;background:var(--akzent);color:#160C2B;border:0;display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:all .2s}
.kachel:hover .spielknopf,.kachel:focus-visible .spielknopf{opacity:1;transform:none}
@media (hover:none){ .spielknopf{opacity:1;transform:none;width:44px;height:44px} }
.spielknopf svg{width:22px;height:22px}
/* Detail */
.held{display:flex;gap:24px;align-items:flex-end;padding:72px 24px 24px;background:linear-gradient(180deg,var(--farbe) 0%,color-mix(in srgb,var(--farbe) 45%,var(--panel)) 100%)}
.held img{width:232px;height:232px;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.55);flex:0 0 auto}
.held .art{font-size:.9rem;font-weight:600}
.held h1{font-size:clamp(2.2rem,6vw,4.8rem);line-height:1;margin:8px 0 12px;letter-spacing:-.02em}
.held .wer{font-weight:700;font-size:1.05rem}
.held .wer span{font-weight:400;opacity:.85}
@media (max-width:700px){ .held{flex-direction:column;align-items:flex-start;padding-top:24px} .held img{width:180px;height:180px} }
.aktion{display:flex;align-items:center;gap:18px;padding:20px 24px;background:linear-gradient(180deg,color-mix(in srgb,var(--farbe) 22%,var(--panel)),var(--panel) 160px)}
.gross{width:58px;height:58px;border-radius:50%;background:var(--akzent);border:0;display:grid;place-items:center;color:#160C2B}
.gross:hover{transform:scale(1.05);background:#BBA4FF}
.gross svg{width:26px;height:26px}
.pille{border:1.5px solid var(--leise);background:none;border-radius:999px;padding:8px 18px;font-weight:700;text-decoration:none;font-size:.95rem}
.pille:hover{border-color:var(--text)}
.pille.an{border-color:var(--akzent);color:var(--akzent)}
.abschnitt-d{padding:6px 24px 10px}
.abschnitt-d h2{font-size:1.5rem;margin:22px 0 12px}
.info{color:var(--leise);max-width:60rem;font-size:1.05rem}
.info.zu{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mehr{background:none;border:0;font-weight:700;padding:6px 0;color:var(--text)}
.fakten{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fakt{background:var(--karte);border-radius:999px;padding:8px 14px;font-size:.92rem}
.fakt b{font-weight:700}
.probe{display:flex;align-items:center;gap:16px;background:var(--karte);border-radius:10px;padding:12px;margin-top:18px;max-width:60rem}
.probe img{width:72px;height:72px;border-radius:6px}
.probe b{display:block}
.probe span{color:var(--leise);font-size:.9rem}
.probe .klein{width:44px;height:44px;margin-left:auto}
.folgen{list-style:none;margin:0;padding:0;max-width:60rem}
.folgen li{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:14px 8px;border-top:1px solid var(--linie);border-radius:6px}
.folgen li:hover{background:var(--karte)}
.folgen .nr{width:64px;height:64px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:1.5rem;color:#fff}
.folgen b{display:block;font-size:1.05rem}
.folgen span{color:var(--leise);font-size:.9rem}
.folgen .zeit{color:var(--leise);font-size:.88rem;white-space:nowrap}
.figuren{display:flex;gap:18px;overflow-x:auto;padding-bottom:8px}
.figur{flex:0 0 150px;text-align:center}
.figur .kreis{width:130px;height:130px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:3rem;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.4);background:radial-gradient(circle at 50% 35%,#3A2F4F,#231C30);overflow:hidden;transition:transform .2s}
.figur .kreis img{width:100%;height:100%;object-fit:cover;display:block}
.figur:hover .kreis{transform:scale(1.04)}
.figur b{display:block;font-size:.98rem}
.figur span{color:var(--leise);font-size:.85rem}
/* Einkauf: Summe und Warenkorb */
.summe-box{background:linear-gradient(130deg,#3B2A64,#1F1929);border-radius:16px;padding:16px;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.summe-box .leise{color:var(--leise)}
.summe-box .betrag{font-size:1.6rem;font-weight:800;display:block;line-height:1.1}
.summe-box small{display:block;color:var(--leise);font-size:.82rem;margin-top:4px}
/* Charaktere */
.figurreihe{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.fig-link{flex:0 0 100px;text-align:center;text-decoration:none;border-radius:12px;padding:6px 2px}
.fig-link:hover{background:var(--karte)}
.fig-bild{width:84px;height:84px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:2rem;font-weight:800;color:#fff;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.fig-bild{background:radial-gradient(circle at 50% 35%,#3A2F4F,#231C30)!important}
.fig-bild img{width:100%;height:100%;object-fit:cover;display:block}
.fig-bild img.cover{transform:scale(1.4);transform-origin:50% 72%}   /* nur Cover ohne eigenes Bild: auf die Figur zoomen */
.fig-link b{display:block;font-size:.9rem;font-weight:600;line-height:1.2}
.fig-link span{display:block;color:var(--leise);font-size:.78rem}
.zeile .fig-bild{display:grid;width:48px;height:48px;margin:0;font-size:1.2rem;flex:0 0 auto;box-shadow:none}
.zeile .fig-bild span{display:inline;color:#fff;font-size:inherit}
.zeile.an{background:var(--hover)}
.figur-kopf{display:flex;gap:24px;align-items:flex-end;padding:56px 24px 24px;background:linear-gradient(180deg,var(--farbe) 0%,color-mix(in srgb,var(--farbe) 40%,var(--panel)) 100%)}
.figur-kopf .fig-bild{width:180px;height:180px;margin:0;font-size:4.5rem;flex:0 0 auto}
.figur-kopf h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1;margin:8px 0 10px}
.figur-kopf p{margin:0;max-width:40rem}
.figur-kopf .art{font-size:.9rem;font-weight:600}
@media (max-width:700px){ .figur-kopf{flex-direction:column;align-items:flex-start;padding-top:20px} .figur-kopf .fig-bild{width:130px;height:130px;font-size:3.2rem} }
.ausruestung{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;max-width:60rem}
.ding{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--karte);border-radius:10px;padding:12px 14px}
.ding b{display:block;font-size:.98rem}
.ding span{color:var(--leise);font-size:.85rem}
.ding a,.ding em{font-size:.85rem;white-space:nowrap}
.ding em{color:var(--leise);font-style:normal}
.paket{margin-top:12px;max-width:60rem;border-radius:12px;padding:18px;background:linear-gradient(120deg,#3B2A64,#1F1929);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.paket b{font-size:1.1rem}
.paket span{color:var(--leise);display:block;font-size:.92rem}
.hinweis-klein{color:var(--leise);font-size:.8rem;margin-top:8px;max-width:60rem}
/* rechte Spalte */
.jetzt{padding:16px}
.jetzt h2{font-size:1.05rem;margin:0 0 14px}
.jetzt .cover{width:100%;aspect-ratio:1;border-radius:8px;display:block}
.jetzt h3{font-size:1.5rem;margin:14px 0 2px}
.jetzt .unter{color:var(--leise);margin:0 0 14px}
.box{background:var(--karte);border-radius:10px;padding:14px;margin-top:12px}
.box h4{margin:0 0 10px;font-size:1rem}
.werte{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.werte div span{display:block;color:var(--leise);font-size:.8rem}
.werte div b{font-size:1.05rem}
.balken{height:6px;background:var(--hover);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.balken i{display:block;height:100%;background:var(--gruen)}
.knopfreihe{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.voll{background:var(--akzent);color:#160C2B;border:0;border-radius:999px;padding:10px 18px;font-weight:800;text-decoration:none;display:inline-block}
.zurueck{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:12px 16px;background:linear-gradient(var(--panel),transparent)}
.mobil-jetzt{display:none}
@media (max-width:1180px){ .mobil-jetzt{display:block} }
.jetzt .dran b{display:block;font-size:1.05rem}
.jetzt .dran a{color:var(--akzent);font-weight:800;text-decoration:none}
/* Handy-Start: eigene Party zuerst, dann das spielbare Abenteuer groß */
.handy{display:none}
@media (max-width:640px){
  .inhalt:not(.sucht) .handy{display:flex;flex-direction:column;gap:18px}
  .inhalt:not(.sucht) .desk{display:none}
}
.meine{background:radial-gradient(130% 90% at 50% 0,rgba(167,139,250,.28),rgba(167,139,250,0) 70%),linear-gradient(130deg,#2B2147,#1F1929);border-radius:22px;padding:14px 16px 16px;box-shadow:inset 0 0 0 1px rgba(167,139,250,.22)}
.m-oben{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.m-oben h2{margin:0;font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--leise)}
.m-status{background:rgba(167,139,250,.2);color:var(--text);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:800;white-space:nowrap}
.m-status.gut{background:var(--gruen);color:#062B12}
.m-kopf{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.m-bogen{width:92px;height:auto;flex:0 0 auto;overflow:visible}
.m-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.m-chips span{background:rgba(0,0,0,.28);border-radius:999px;padding:4px 11px;font-size:.84rem;color:#D9D2E8;white-space:nowrap}
.m-kopf b{display:block;font-size:1.3rem;line-height:1.15;margin-bottom:3px}
.meine .unter0{display:block;color:var(--leise);font-size:.9rem}
.m-weiter{display:flex;align-items:center;justify-content:center;min-height:52px;font-size:1.05rem;margin-top:14px}
.meine .dran0{margin-top:10px;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;min-height:48px;text-decoration:none;color:inherit}
.meine .dran0 em{font-style:normal;color:var(--leise)}
.meine .dran0 svg{width:20px;height:20px;color:var(--akzent);flex:0 0 auto}
.kompakt{display:flex;align-items:center;gap:10px;background:var(--karte);border-radius:16px;padding:10px 12px 10px 10px}
.reihe-bald .kompakt a{flex:1;display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.reihe-bald .kompakt img{width:72px;height:72px;border-radius:12px;filter:none;flex:0 0 auto}
.reihe-bald .kompakt b{display:block;font-size:1.02rem;margin:0;white-space:normal}
.reihe-bald .kompakt span span{display:block;color:var(--leise);font-size:.84rem;line-height:1.3}
.kompakt .probeknopf{border-color:var(--leise);color:var(--text)}
.bald-unter{margin:-6px 0 12px;color:var(--leise);font-size:.9rem}
.buehne{border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--farbe,#7C5BD6),#2A2140)}
.buehne > a img{width:100%;aspect-ratio:1/1;max-height:340px;object-fit:cover;display:block}
.buehne .unten{padding:16px}
.buehne .frei{background:var(--gruen);color:#062B12;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:800}
.buehne h1{font-size:1.8rem;line-height:1.05;margin:10px 0 6px}
.buehne p{margin:0 0 14px;color:#E2DAF2}
.buehne .knoepfe{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.buehne .voll{min-height:48px;display:inline-flex;align-items:center}
.probeknopf{width:48px;height:48px;border-radius:50%;border:1.5px solid #E2DAF2;background:none;display:grid;place-items:center;flex:0 0 auto}
.probeknopf svg{width:20px;height:20px}
.buehne .klein0{color:#E2DAF2;font-size:.85rem}
.zahlen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.zahlen div{background:var(--karte);border-radius:12px;padding:10px 6px}
.zahlen b{display:block;font-size:1.2rem}
.zahlen span{color:var(--leise);font-size:.78rem}
.reihe-bald h2{font-size:1.15rem;margin:6px 0 12px}
.reihe-bald .band{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.reihe-bald a{flex:0 0 130px;text-decoration:none;scroll-snap-align:start}
.reihe-bald img{width:130px;height:130px;border-radius:10px;display:block;filter:saturate(.6) brightness(.75)}
.reihe-bald b{display:block;font-size:.9rem;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reihe-bald span{color:var(--leise);font-size:.8rem}
.ding-hinweis{display:block;margin-top:6px;font-size:.85rem;color:var(--text);opacity:.85}
.ding-hinweis.warn{padding:8px 10px;border-radius:8px;background:rgba(245,158,11,.14);opacity:1}
</style></head><body>
<header class="kopf">
  <a class="marke" href="#/"><span class="logo"><i></i></span><span>Schatzweg</span></a>
  <div class="mitte">
    <a class="rund" href="#/" aria-label="Start"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></a>
    <label class="suche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="suche" type="search" placeholder="Welches Abenteuer suchst du?" aria-label="Abenteuer suchen"></label>
  </div>
  <button type="button" class="profil" id="profil" aria-label="Mein Bereich"><span></span></button>
</header>
<div class="raster">
  <aside class="flaeche bib" aria-label="Meine Abenteuer">
    <h2>Meine Abenteuer</h2>
    <div class="chips" id="bib-chips"></div>
    <div id="bib-liste"></div>
  </aside>
  <main class="flaeche" id="haupt" tabindex="-1"></main>

</div>
<audio id="ton" preload="none"></audio>
<script src="party.js"></script>
<script src="konto.js"></script>
<script>
(function(){
  'use strict';
  var THEMEN=[], TOUR={}, filter='alle', bibFilter='alle', suche='';
  var MERK='sj.merkliste';
  var FIG_FARBEN=['#9050C8','#E23A3F','#2B6FE0','#F28C1B','#3A9D4B','#27A7A0','#C2410C','#DB2777','#4F46E5'];
  var PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
