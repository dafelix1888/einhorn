<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0B17">
<meta name="robots" content="noindex">
<title>Einladung · Zauberspiegel</title>
<link rel="stylesheet" href="dunkel.css">
<style>
body{background:radial-gradient(ellipse at 50% 0%,#3B2A64 0%,var(--bg) 480px) no-repeat,var(--bg)}
.seite{max-width:30rem;display:flex;flex-direction:column;gap:16px;padding-top:24px}
.spiegel{position:relative;width:min(240px,64vw);aspect-ratio:1;margin:0 auto}
.ring{width:100%;height:100%;border-radius:50%;padding:10px;background:linear-gradient(135deg,#F7DE9A,#C8922A 45%,#F2D27A 70%,#B8862B);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.ring div{width:100%;height:100%;border-radius:50%;overflow:hidden}
.ring img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.6);transform-origin:50% 66%}
#probe{position:absolute;right:0;bottom:8px;width:56px;height:56px;border-radius:50%;border:3px solid var(--bg);background:var(--akzent);color:#160C2B;display:grid;place-items:center;padding:0}
#probe svg{width:22px;height:22px}
.titel{text-align:center}
.titel .von{color:var(--leise);font-size:.9rem;font-weight:600}
.titel h1{font-size:clamp(2.2rem,9vw,3rem);line-height:1.05;margin:4px 0 8px}
.titel p{margin:0;color:#D9D2E8}
.kacheln{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.kacheln div{background:var(--karte);border-radius:12px;padding:10px 6px;overflow-wrap:anywhere}
.kacheln span{display:block;color:var(--leise);font-size:.78rem}
.kacheln small{display:block;font-size:.85rem}
.mit{margin:0;text-align:center;color:var(--leise);font-size:.92rem}
.antwort{display:flex;flex-direction:column;gap:10px}
.antwort .ja,.antwort .nein{font:inherit;display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:999px;text-align:center}
.antwort .ja{font-weight:800;font-size:1.1rem;min-height:56px;border:0;background:var(--gruen);color:#062B12}
.antwort .nein{font-weight:700;min-height:48px;border:1.5px solid var(--leise);background:none;color:var(--text)}
.frist{margin:0;text-align:center;color:var(--leise);font-size:.85rem}
.danke{border-radius:16px;padding:16px;text-align:center}
.danke.gut{background:#123321}
.danke.gut p{color:#B9E8C9}
.danke.schade{background:var(--karte)}
.danke b{font-size:1.15rem}
.danke p{margin:4px 0 12px}
.danke .kal{font:inherit;font-weight:800;border:0;background:var(--gruen);color:#062B12;border-radius:999px;padding:0 20px;min-height:44px}
.danke .zurueck{font:inherit;background:none;border:0;color:var(--leise);text-decoration:underline;min-height:44px;padding:0 10px;display:block;margin:6px auto 0}
.fuss{margin-top:12px;border-top:1px solid var(--linie);padding-top:18px;text-align:center;font-size:.92rem}
.fuss a{display:inline-flex;align-items:center;min-height:44px}
</style></head><body>
<main class="seite" id="seite"></main>
<audio id="ton" preload="none"></audio>
<div class="toast" id="toast" hidden></div>
<script src="party.js"></script>
<script src="konto.js"></script>
<script>
(function(){
  'use strict';
  var PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>', PAUSE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  function $(id){ return document.getElementById(id); }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(t){ var e=$('toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){ e.hidden=true; }, 3000); }
  function nichtDa(t){ $('seite').innerHTML='<h1>Einladung nicht gefunden</h1><p class="leise">'+t+'</p><div class="fuss"><a href="index.html">Zur Startseite</a></div>'; }
  var q=new URLSearchParams(location.search), k=q.get('k');
  if(k){                                              // geschützter Link: Daten vom Server, zuletzt gesehene als Ersatz ohne Netz
    var gemerkt=null; try{ gemerkt=JSON.parse(localStorage.getItem('sj.einladung.'+k)||'null'); }catch(x){}
    if(!window.Konto || !Konto.aktiv()){ if(gemerkt) zeigen(gemerkt); else nichtDa('Dieser Link geht hier nicht.'); return; }
    $('seite').innerHTML='<p class="leise">Einladung wird geladen …</p>';
    Konto.linkLesen(k).then(function(r){
      if(!r || r.rolle!=='gast' || !r.daten){ try{ localStorage.removeItem('sj.einladung.'+k); }catch(x){} nichtDa('Der Link wurde ersetzt oder die Party ist vorbei. Bitte die Gastgeber um den neuen Link.'); return; }
      try{ localStorage.setItem('sj.einladung.'+k, JSON.stringify(r.daten)); }catch(x){}
      zeigen(r.daten);
    }, function(){ if(gemerkt) zeigen(gemerkt); else nichtDa('Kein Netz. Bitte später noch einmal öffnen.'); });
    return;
  }
  var e0=null; try{ e0=Party.decode(q.get('e')||''); }catch(x){}
  zeigen(e0);

  function zeigen(e){
  if(!e || !e.d){ nichtDa('Der Link ist unvollständig. Bitte die Gastgeber, ihn noch einmal zu schicken.'); return; }
  var name=String(e.n||'').slice(0,30), alter=e.a, start=new Date(e.d+'T'+(e.s||'15:00')+':00'), thema=String(e.t||'einhorn').replace(/[^a-z0-9-]/gi,'');
  var datumLang=start.toLocaleDateString('de-DE',{weekday:'long', day:'numeric', month:'long'});
  var datumKurz=start.toLocaleDateString('de-DE',{weekday:'short', day:'numeric', month:'numeric'});
  var bis=e.r ? new Date(e.r+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short', day:'numeric', month:'numeric'}) : '';
  var draussen=e.o!=='drinnen';
  var hinweis=typeof e.h==='string' ? e.h : (draussen?'Feste Schuhe und Kleidung für draußen.':'');   // ältere Links ohne Hinweisfeld
  document.title=name+' wird '+alter+'! · Einladung';

  function antwortText(ja){ return ja ? 'Hallo! Wir kommen gern zu '+name+'s Einhorn-Party am '+datumLang+'. 🦄' : 'Hallo! Leider können wir am '+datumLang+' nicht zu '+name+'s Party kommen. Ganz liebe Grüße!'; }
  function antwortLink(ja){
    var t=encodeURIComponent(antwortText(ja)), tel=String(e.tel||'').replace(/[^0-9+]/g,'');
    if(tel){ var wa=/^\+/.test(tel) ? tel.slice(1) : /^00/.test(tel) ? tel.slice(2) : tel.replace(/^0/,'49'); return 'https://wa.me/'+wa+'?text='+t; }
    return null;
  }
  function ics(){
    function z(n){ return ('0'+n).slice(-2); } function f(d){ return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'T'+z(d.getHours())+z(d.getMinutes())+'00'; }
    var ende=e.b ? new Date(e.d+'T'+e.b+':00') : new Date(start.getTime()+150*60000);
    return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Zauberspiegel//Einladung//DE','BEGIN:VEVENT','UID:einladung-'+e.d+'-'+encodeURIComponent(name)+'@zauberspiegel','DTSTAMP:'+f(new Date()),
      'DTSTART:'+f(start),'DTEND:'+f(ende),'SUMMARY:'+name+'s Einhorn-Party','LOCATION:'+String(e.w||'').replace(/[,;]/g,'\\$&'),'DESCRIPTION:Abholen um '+(e.b||'')+' Uhr'+(hinweis?'. Bitte beachten: '+hinweis.replace(/[,;]/g,'\\$&'):''),'END:VEVENT','END:VCALENDAR'].join('\r\n')+'\r\n';
  }
  var ja=antwortLink(true), nein=antwortLink(false);

  // Antwort-Bereich: erst die zwei Knöpfe, nach dem Tippen eine Bestätigung. Die Antwort geht nur über WhatsApp oder den kopierten Text an die Gastgeber.
  function antwortZeichnen(stand){
    var h;
    if(stand==='ja'){
      h='<div class="danke gut" role="status"><b>Schön, ihr seid dabei!</b><p>'+(ja?'Schickt die Nachricht in WhatsApp ab, dann wissen die Gastgeber Bescheid.':'Schickt den kopierten Text an die Gastgeber, dann wissen sie Bescheid.')+'</p>'+
        '<button type="button" class="kal" id="kal">In den Kalender</button><button type="button" class="zurueck" data-zurueck>Antwort ändern</button></div>';
    } else if(stand==='nein'){
      h='<div class="danke schade" role="status"><b>Schade!</b><p class="leise">'+(ja?'Schickt die Nachricht in WhatsApp ab, dann wissen die Gastgeber Bescheid.':'Schickt den kopierten Text an die Gastgeber, dann wissen sie Bescheid.')+'</p>'+
        '<button type="button" class="zurueck" data-zurueck>Antwort ändern</button></div>';
    } else {
      h='<div class="antwort">'+(ja
        ? '<a class="ja" href="'+ja+'" target="_blank" rel="noopener" data-gewaehlt="ja">Wir kommen!</a><a class="nein" href="'+nein+'" target="_blank" rel="noopener" data-gewaehlt="nein">Wir können leider nicht</a>'
        : '<button type="button" class="ja" data-antwort="1">Wir kommen!</button><button type="button" class="nein" data-antwort="0">Wir können leider nicht</button>')+'</div>'+
        (bis?'<p class="frist">Bitte bis '+esc(bis)+' Bescheid geben.</p>':'');
    }
    $('antwort').innerHTML=h;
  }

  $('seite').innerHTML=
    '<div class="spiegel"><div class="ring"><div><img src="themen/'+thema+'/cover.svg" alt="Funkel, das Einhorn"></div></div><button type="button" id="probe" aria-label="Funkels Gruß anhören">'+PLAY+'</button></div>'+
    '<div class="titel"><div class="von">Funkel lädt ein</div><h1>'+esc(name)+' wird '+esc(alter)+'!</h1><p>Eine Einhorn-Schnitzeljagd mit sprechendem Zauberspiegel.</p></div>'+
    '<div class="kacheln"><div><span>Wann</span><b>'+esc(datumKurz)+'</b><small>'+esc(e.s)+' Uhr</small></div><div><span>Wo</span><b>'+esc(e.w)+'</b></div><div><span>Abholen</span><b>'+esc(e.b)+'</b><small>Uhr</small></div></div>'+
    (hinweis?'<div class="mit"><b>Bitte mitbringen und beachten</b><br>'+esc(hinweis)+'</div>':'')+
    '<div id="antwort"></div>'+
    '<div class="fuss"><p class="leise">Selbst bald eine Party? Funkels Regenbogen plant die Schnitzeljagd für jeden Park und jede Wohnung.</p><a href="index.html#/abenteuer/einhorn">So funktioniert der Zauberspiegel</a></div>';
  antwortZeichnen('');

  document.addEventListener('click', function(ev){
    var g=ev.target.closest('[data-gewaehlt]');
    if(g){ var s=g.getAttribute('data-gewaehlt'); setTimeout(function(){ antwortZeichnen(s); }, 0); return; }   // erst nach dem Öffnen von WhatsApp umbauen
    var b=ev.target.closest('[data-antwort]');
    if(b){
      var jaW=b.getAttribute('data-antwort')==='1', t=antwortText(jaW);
      antwortZeichnen(jaW?'ja':'nein');
      if(navigator.share){ navigator.share({text:t})['catch'](function(){}); return; }
      try{ navigator.clipboard.writeText(t).then(function(){ toast('Text kopiert. An die Gastgeber schicken.'); }, function(){ prompt('Text kopieren:', t); }); }catch(x){ prompt('Text kopieren:', t); }
      return;
    }
    if(ev.target.closest('[data-zurueck]')){ antwortZeichnen(''); return; }
    if(ev.target.closest('#kal')){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics()],{type:'text/calendar'})); a.download='einladung.ics'; document.body.appendChild(a); a.click(); a.remove(); return; }
    if(ev.target.closest('#probe')){ var au=$('ton'); if(!au.paused){ au.pause(); return; } if(!au.src) au.src='themen/'+thema+'/hoerprobe.mp3'; au.play()['catch'](function(){}); }
  });
  $('ton').addEventListener('play', function(){ $('probe').innerHTML=PAUSE; $('probe').setAttribute('aria-label','Anhalten'); });
  $('ton').addEventListener('pause', function(){ $('probe').innerHTML=PLAY; $('probe').setAttribute('aria-label','Funkels Gruß anhören'); });
  }
})();
</script>
<script src="recht.js"></script>
</body></html>
