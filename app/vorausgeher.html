<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0B17">
<title>Vorausgeher · Zauberspiegel</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="dunkel.css">
<style>
.start{background:linear-gradient(130deg,#3B2A64,#1F1929);border-radius:16px;padding:16px;margin:10px 0 14px}
.start b{font-size:1.6rem;display:block}
#karte{height:46vh;min-height:260px;border-radius:14px;margin-bottom:14px}
.leaflet-container{background:#1F1929}
.nr-marker{background:var(--akzent-tief);color:#fff;font-weight:800;border-radius:50%;width:34px!important;height:34px!important;margin:-17px 0 0 -17px!important;display:grid;place-items:center;border:3px solid #fff;font-size:15px}
.nr-marker.fertig{background:#16A34A}
.ich{width:18px!important;height:18px!important;margin:-9px 0 0 -9px!important;border-radius:50%;background:#38BDF8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(56,189,248,.3)}
.station{background:var(--karte);border-radius:14px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:40px 1fr;gap:12px}
.station.fertig{opacity:.6}
.station .nr{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--akzent-tief)}
.station.fertig .nr{background:#16A34A}
.station b{display:block;font-size:1.05rem}
.station ul{margin:8px 0;padding-left:1.1rem;color:var(--text)}
.station li{margin:3px 0}
.station .wo{color:var(--leise);font-size:.92rem}
.station .dist{color:var(--akzent);font-weight:700;font-size:.92rem}
</style></head><body>
<main class="seite" id="seite"><p class="leise">Lädt …</p></main>
<div class="toast" id="toast" hidden></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="planer-kern.js"></script>
<script src="party.js"></script>
<script>
(function(){
  'use strict';
  var q=new URLSearchParams(location.search), thema=(q.get('thema')||'einhorn').replace(/[^a-z0-9-]/gi,'');
  if(q.get('plan')){ try{ Party.ausLinkUebernehmen(thema, q.get('plan')); }catch(e){} q.delete('plan'); try{ history.replaceState(null,'',location.pathname+'?'+q.toString()); }catch(e){} }
  var party=Party.lesen(thema), plan=Party.plan(thema), tour=null, ich=null, karte=null, marker=[], ichMarker=null;
  var RAUM={'Küche':1,'Flur':2,'Treppe':3,'Türen':4,'Kissenberg':5,'Sofa':6};
  function $(id){ return document.getElementById(id); }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(t){ var e=$('toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){ e.hidden=true; }, 3000); }
  function km(m){ return m>=1000 ? (m/1000).toFixed(1).replace('.',',')+' km' : Math.round(m)+' m'; }
  if(!party){ $('seite').innerHTML='<h1>Vorausgeher</h1><p class="leise">Auf diesem Handy ist noch keine Party. Bitte die Gastgeber um den Link für den Vorausgeher.</p>'; return; }
  var v=Party.variante(party), drinnen=v==='c';
  party.aufgebaut=party.aufgebaut||{};

  // Was wohin: Packliste der Vorausgeher-Tasche den Stationen zuordnen
  function wasWohin(){
    var gr=(tour.vorbereitung.variante[v]||[]).filter(function(g){ return /Vorausgeher/.test(g.t); })[0], je={};
    (gr?gr.items:[]).forEach(function(it){
      var t=it.replace(/\{kinder\}/g, party.kinder), m=t.match(/\(Station (\d)\)\s*$/), i=null;
      if(m){ i=+m[1]-1; t=t.replace(m[0],'').trim(); }
      else { var r=t.match(/\(([^)]+)\)\s*$/); if(r && RAUM[r[1]]!=null){ i=RAUM[r[1]]; t=t.replace(r[0],'').trim(); } }
      if(i==null) i=tour.stationen.length-1;
      (je[i]=je[i]||[]).push(t);
    });
    return je;
  }
  function stationsListe(){
    var je=wasWohin(), st=(plan&&plan.stationen)||[];
    return tour.stationen.map(function(s,i){
      if(i===0) return null;
      var o=tour.varianten[v] && tour.varianten[v].st && tour.varianten[v].st[i] || {};
      var p=st[i]||{};
      return {i:i, titel:s.title||(s.steps&&s.steps[0].title)||'', name:drinnen?(o.wo||s.wo):(p.name||s.name), wo:o.wo||s.wo, lat:p.lat, lng:p.lng, sachen:je[i]||[], vorOrt:o.vorOrt||s.vorOrt};
    }).filter(Boolean);
  }
  function zeichnen(){
    if(!tour) return;
    var l=stationsListe(), fertig=l.filter(function(s){ return party.aufgebaut[s.i]; }).length, naechste=l.filter(function(s){ return !party.aufgebaut[s.i]; })[0];
    var h='<div class="oben"><span class="leise">'+esc(party.kind&&party.kind.name?party.kind.name+'s Party':'Party')+'</span><span class="leise">'+fertig+' von '+l.length+' aufgebaut</span></div>'+
      '<h1>Vorausgeher</h1><div class="start"><span class="leise">Losgehen um</span><b>'+Party.uhr(party,-20)+' Uhr</b><span class="leise">Die Gruppe startet um '+esc(party.start)+' Uhr. '+(drinnen?'Station 6 und 7 bei geschlossener Tür aufbauen.':'Mit der Tasche vorgehen und Station für Station aufbauen.')+'</span></div>'+
      (drinnen?'':'<div id="karte"></div>');
    l.forEach(function(s){
      var an=!!party.aufgebaut[s.i], dist=(ich && s.lat!=null) ? PlanerKern.meter(ich, s) : null;
      h+='<div class="station'+(an?' fertig':'')+'"><span class="nr">'+(an?'✓':s.i+1)+'</span><div><b>'+esc(s.titel)+'</b><div class="wo">'+esc(s.name)+(s.wo&&s.wo!==s.name?' · '+esc(s.wo):'')+'</div>'+
        (dist!=null && s===naechste?'<div class="dist">noch '+km(dist)+'</div>':'')+
        (s.sachen.length?'<ul>'+s.sachen.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>':'<p class="leise" style="margin:8px 0">Nichts aufbauen, nur vorbeigehen.</p>')+
        (s.vorOrt?'<p class="leise" style="font-size:.9rem">Für die Gruppe: '+esc(s.vorOrt)+'</p>':'')+
        '<div class="reihe">'+(s.lat!=null&&!drinnen?'<a class="knopf klein leer" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&travelmode=walking&destination='+s.lat+','+s.lng+'">Hinlaufen</a>':'')+
        '<button class="knopf klein'+(an?' leer':'')+'" data-auf="'+s.i+'">'+(an?'Doch noch nicht':'Aufgebaut')+'</button></div></div></div>';
    });
    h+='<p class="hinweis">Die Haken sieht bisher nur dieses Handy. Dass das iPad live mitsieht, kommt mit dem Server.</p>';
    var y=window.scrollY; $('seite').innerHTML=h; window.scrollTo(0,y);
    if(!drinnen) karteZeichnen(l);
  }
  function karteZeichnen(l){
    var punkte=l.filter(function(s){ return s.lat!=null; }); if(!punkte.length){ $('karte').outerHTML='<p class="hinweis">Noch keine Route geplant. Die Gastgeber planen sie im Planer.</p>'; return; }
    karte=L.map('karte',{zoomControl:true}); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OpenStreetMap'}).addTo(karte);
    var route=(Party.plan(thema)||{}).route; if(route) L.polyline(route,{color:'#A78BFA', weight:5, opacity:.8}).addTo(karte);
    punkte.forEach(function(s){ L.marker([s.lat,s.lng],{icon:L.divIcon({className:'nr-marker'+(party.aufgebaut[s.i]?' fertig':''), html:party.aufgebaut[s.i]?'✓':String(s.i+1), iconSize:[34,34]})}).addTo(karte).bindTooltip((s.i+1)+' · '+s.name); });
    if(ich) ichMarker=L.marker([ich.lat,ich.lng],{icon:L.divIcon({className:'ich', iconSize:[18,18]})}).addTo(karte);
    karte.fitBounds(L.latLngBounds(punkte.map(function(s){ return [s.lat,s.lng]; }).concat(ich?[[ich.lat,ich.lng]]:[])).pad(0.15));
  }
  document.addEventListener('click', function(e){
    var b=e.target.closest('[data-auf]'); if(!b) return;
    var i=b.getAttribute('data-auf'); party.aufgebaut[i]=!party.aufgebaut[i];
    try{ var alt=Party.lesen(thema)||party; alt.aufgebaut=party.aufgebaut; localStorage.setItem('sj.party.'+thema, JSON.stringify(alt)); }catch(x){}
    if(party.aufgebaut[i]) toast('Station '+(+i+1)+' steht.');
    zeichnen();
  });
  var letzte=0;
  if(!drinnen && navigator.geolocation) navigator.geolocation.watchPosition(function(p){
    ich={lat:p.coords.latitude, lng:p.coords.longitude};
    if(Date.now()-letzte>8000){ letzte=Date.now(); zeichnen(); }               // alle paar Sekunden: Abstand und eigener Punkt
  }, function(){}, {enableHighAccuracy:true, maximumAge:5000});
  fetch('themen/'+thema+'/tour.json').then(function(r){ return r.json(); }).then(function(t){ tour=t; zeichnen(); })
    ['catch'](function(){ $('seite').innerHTML='<p>Thema lässt sich nicht laden. Einmal mit Netz öffnen.</p>'; });
})();
</script>
</body></html>
