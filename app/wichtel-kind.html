<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d1712">
<title>Bommi · Schatzweg</title>
<!-- Kinder-Ansicht (UNICORN-143): nur die heutige Geschichte. Erst Bommis Video, dann die Bildergeschichte zum Blättern. -->
<style>
  :root { --nacht:#1d1712; --papier:#fbf6ec; --tinte:#3b2f25; --rot:#b8322a; --gruen:#5d7a3a; --leise:#7a6a5a; --linie:#e8dfcf; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--nacht); color:var(--tinte); font:20px/1.45 Georgia, "Times New Roman", serif; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  [hidden] { display:none !important; }
  button { font:inherit; cursor:pointer; }

  /* Erwachsene: unauffällig oben rechts, 2 Sekunden halten führt zurück (wie die bewusste Geste der Tour) */
  #erw { position:fixed; top:calc(8px + env(safe-area-inset-top)); right:10px; z-index:5; border:0; border-radius:999px; padding:6px 12px; background:rgba(255,255,255,.14); color:#f4ead8; font-size:.8rem; overflow:hidden; }
  body.bilder #erw { background:rgba(59,47,37,.08); color:var(--leise); }
  #erw .fill { position:absolute; inset:0; width:0; background:rgba(255,255,255,.3); }
  #erw.halten .fill { width:100%; transition:width 2s linear; }
  #erw span { position:relative; }

  /* Video: hochkant, so groß wie möglich, nie verzerrt */
  #s-video { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #video { width:100%; height:100%; max-width:calc(100dvh * 9 / 16); object-fit:contain; background:#000; display:block; }
  #start { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:132px; height:132px; border-radius:50%; border:0; background:var(--rot); color:#fff; box-shadow:0 8px 30px rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; }
  #start svg { width:58px; height:58px; margin-left:8px; }
  #ueberspringen { position:absolute; bottom:calc(16px + env(safe-area-inset-bottom)); right:16px; border:0; border-radius:999px; padding:8px 14px; background:rgba(255,255,255,.16); color:#f4ead8; font-size:.85rem; }

  /* Bildergeschichte */
  #s-bilder { min-height:100%; background:var(--papier); }
  .buch { max-width:560px; margin:0 auto; padding:calc(44px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); }
  .rahmen { position:relative; touch-action:pan-y; }
  #bild { width:100%; max-height:62dvh; aspect-ratio:9/16; object-fit:cover; border-radius:18px; display:block; margin:0 auto; background:var(--linie); user-select:none; -webkit-user-drag:none; }
  @media (min-aspect-ratio: 3/4) { #bild { width:auto; height:62dvh; } }
  .pfeil { position:absolute; top:50%; transform:translateY(-50%); width:60px; height:60px; border-radius:50%; border:0; background:rgba(255,255,255,.88); color:var(--tinte); font-size:2rem; line-height:1; box-shadow:0 3px 12px rgba(0,0,0,.18); }
  .pfeil[disabled] { opacity:0; pointer-events:none; }
  #zurueck { left:6px; } #weiter { right:6px; }
  #text { font-size:clamp(23px, 1.5vw + 16px, 27px); margin:.8em 0 .4em; min-height:5em; }
  .leiste { display:flex; align-items:center; gap:10px; }
  #vorlesen { border:0; border-radius:999px; min-height:52px; padding:10px 20px; background:var(--gruen); color:#fff; font-weight:700; display:inline-flex; align-items:center; gap:8px; }
  #vorlesen[aria-pressed=true] { background:var(--rot); }
  #punkte { margin-left:auto; display:flex; gap:6px; }
  #punkte span { width:10px; height:10px; border-radius:50%; background:var(--linie); }
  #punkte span.an { background:var(--rot); }
  #ende { margin:16px 0 0; background:#fff; border:2px solid var(--linie); border-radius:16px; padding:14px 16px; display:flex; gap:14px; align-items:center; }
  #bommel { flex:0 0 auto; width:54px; height:54px; border-radius:50%; box-shadow:inset -6px -6px 0 rgba(0,0,0,.12); }
  #ende b { display:block; }
  #ende p { margin:.2em 0 0; font-size:1rem; }

  /* Schranke vor Geschichte 2 (UNICORN-144): für die Eltern, freundlich, ohne Druck */
  #s-schranke { min-height:100%; background:var(--papier); }
  #s-schranke .buch { max-width:480px; }
  #s-schranke img { width:132px; height:132px; object-fit:cover; border-radius:50%; display:block; margin:0 auto 10px; background:var(--linie); }
  #s-schranke h1 { font-size:1.6rem; text-align:center; margin:.2em 0 .4em; }
  #s-schranke p { font-size:1.02rem; margin:.5em 0; }
  #s-schranke .haken { display:flex; gap:12px; align-items:flex-start; background:#fff; border:1.5px solid var(--linie); border-radius:14px; padding:12px 14px; margin:16px 0; cursor:pointer; font-size:1rem; }
  #s-schranke .haken input { width:24px; height:24px; margin:2px 0 0; accent-color:var(--rot); flex:0 0 auto; }
  #s-schranke .haken small { display:block; color:var(--leise); font-size:.88rem; }
  #anmelden { width:100%; border:0; border-radius:999px; min-height:54px; background:var(--rot); color:#fff; font-weight:700; }
  #s-schranke .klein { color:var(--leise); font-size:.86rem; text-align:center; }
  #s-schranke a { color:var(--tinte); }
</style>
</head>
<body>
<button type="button" id="erw" aria-label="Für Erwachsene: 2 Sekunden halten, um zurückzugehen"><span class="fill"></span><span>Erwachsene</span></button>

<section id="s-schranke" hidden>
  <div class="buch">
    <img id="schranke-bild" alt="">
    <h1>Bommi bleibt bei euch</h1>
    <p>Die erste Geschichte war geschenkt. Ab jetzt meldet ihr euch einmal an. Dann liegt euer Plan im Konto und ist auf Handy und Tablet gleich.</p>
    <p>Kein Passwort: Ihr bekommt einen Code per E-Mail. Es ist dasselbe Konto wie für die Einhorn-Tour.</p>
    <label class="haken"><input type="checkbox" id="erinnern"><span>Bommi darf mich erinnern<small>Eine Mail am Vorabend jeder Geschichte und zwei Mails mit der Bitte um eure Meinung. Jederzeit abbestellbar.</small></span></label>
    <button type="button" id="anmelden">Anmelden und weiter</button>
    <p class="klein"><a href="datenschutz.html#bommi">Datenschutz</a></p>
  </div>
</section>

<section id="s-video" hidden>
  <video id="video" playsinline preload="metadata"></video>
  <button type="button" id="start" aria-label="Video starten" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3l12 7-12 7z" fill="currentColor"/></svg></button>
  <button type="button" id="ueberspringen" hidden>Zur Bildergeschichte</button>
</section>

<section id="s-bilder" hidden>
  <div class="buch">
    <div class="rahmen" id="rahmen">
      <img id="bild" alt="">
      <button type="button" class="pfeil" id="zurueck" aria-label="Bild zurück">‹</button>
      <button type="button" class="pfeil" id="weiter" aria-label="Nächstes Bild">›</button>
    </div>
    <p id="text"></p>
    <div class="leiste">
      <button type="button" id="vorlesen" aria-pressed="false">Bommi liest vor</button>
      <div id="punkte" aria-hidden="true"></div>
    </div>
    <div id="ende" hidden>
      <span id="bommel"></span>
      <div><b id="mitmachen"></b><p id="satz"></p></div>
    </div>
  </div>
</section>

<script src="wichtel-kern.js"></script>
<script src="konto.js"></script>
<script src="wichtel-konto.js"></script>
<script>
(function(){
  'use strict';
  var WK=window.WichtelKern, $=function(id){ return document.getElementById(id); };
  var FARBE={rot:'#c8352c', hellbraun:'#c39a6b', 'grün':'#4f8a3a', hellblau:'#8cc0e6', gelb:'#e8b923', 'weiß':'#f4f1ea', violett:'#7b4fa6', golden:'radial-gradient(circle at 35% 30%,#fff3b0,#d4a72c 60%,#9c7418)'};
  function heute(){ var t=new Date(); return t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2); }
  function lies(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
  function schreib(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  // Messpunkte (Namen aus MAR-77, Senden über marketer.track, sobald UNICORN-140 es einbindet). Höchstens einmal je Seitenaufruf.
  var gemessen={}; window.wichtelMessung=[];
  function messen(name, props, einmal){
    if(einmal){ if(gemessen[einmal]) return; gemessen[einmal]=true; }
    var p=Object.assign({produkt:'wichtel'}, props||{});
    window.wichtelMessung.push({name:name, props:p});
    if(window.marketer && window.marketer.track){ try{ window.marketer.track(name, p); }catch(e){} }
  }

  var nr, g, m, seite=0, ton=window.wichtelTon=new Audio(), vorlesenAn=!!lies('sj.wichtel.vorlesen');

  // ---------- Erwachsene: 2 Sekunden halten ----------
  var halteZeit=null, erw=$('erw');
  function halten(e){ e.preventDefault(); erw.classList.add('halten'); halteZeit=setTimeout(function(){ ton.pause(); location.href='wichtel.html'; }, 2000); }
  function loslassen(){ erw.classList.remove('halten'); clearTimeout(halteZeit); }
  erw.addEventListener('pointerdown', halten); ['pointerup','pointerleave','pointercancel'].forEach(function(t){ erw.addEventListener(t, loslassen); });
  erw.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // ---------- Video ----------
  var video=$('video'), videoBereit=false;
  function videoZeigen(){
    $('s-video').hidden=false;
    video.poster=m.bilder[0].bild;
    video.addEventListener('loadedmetadata', function(){ videoBereit=true; if(video.paused) $('start').hidden=false; });
    video.addEventListener('error', function(){ bilderZeigen(); }, {once:true});   // kein Video: gleich zur Bildergeschichte
    video.addEventListener('play', function(){ $('start').hidden=true; setTimeout(function(){ $('ueberspringen').hidden=false; }, 4000); messen('wichtel_story_started', {geschichte:nr, format:'video'}, 'v-start'); });
    video.addEventListener('pause', function(){ if(!video.ended && !$('s-video').hidden) $('start').hidden=false; });
    video.addEventListener('ended', function(){ messen('wichtel_story_completed', {geschichte:nr, format:'video'}, 'v-ende'); bilderZeigen(); });
    video.addEventListener('click', function(){ if(!video.paused) video.pause(); });
    $('start').onclick=function(){ $('start').hidden=true; var p=video.play(); if(p && p['catch']) p['catch'](function(){ $('start').hidden=false; }); };
    $('ueberspringen').onclick=function(){ video.pause(); bilderZeigen(); };
    video.src=m.video;
    setTimeout(function(){ if(!videoBereit && $('s-bilder').hidden) $('start').hidden=false; }, 6000);   // langsames Netz: trotzdem starten lassen
  }

  // ---------- Bildergeschichte ----------
  function bilderZeigen(){
    if(!$('s-bilder').hidden) return;
    try{ video.pause(); }catch(e){}
    $('s-video').hidden=true; $('s-bilder').hidden=false; document.body.classList.add('bilder');
    messen('wichtel_story_started', {geschichte:nr, format:'bilder'}, 'b-start');
    zeige(0);
  }
  function zeige(n){
    var anzahl=g.bilder.length;
    seite=Math.max(0, Math.min(anzahl-1, n));
    ton.pause();
    var b=$('bild'); b.onerror=function(){ b.onerror=null; b.src=m.ersatz; }; b.src=m.bilder[seite].bild;
    $('text').textContent=g.bilder[seite].text;
    $('zurueck').disabled=seite===0; $('weiter').disabled=seite===anzahl-1;
    [].forEach.call($('punkte').children, function(p,i){ p.className=i===seite?'an':''; });
    var letzte=seite===anzahl-1;
    $('ende').hidden=!letzte;
    if(letzte){
      var gesp=lies('sj.wichtel.gespielt')||[]; if(gesp.indexOf(nr)<0){ gesp.push(nr); schreib('sj.wichtel.gespielt', gesp); if(window.WichtelKonto) WichtelKonto.geaendert(); }
      messen('wichtel_story_completed', {geschichte:nr, format:'bilder'}, 'b-ende');
    }
    if(vorlesenAn) abspielen();
    window.scrollTo(0,0);
  }
  function abspielen(){
    ton.src=m.bilder[seite].ton;
    var p=ton.play(); if(p && p['catch']) p['catch'](function(){});
  }
  ton.addEventListener('ended', function(){ if(vorlesenAn && seite<g.bilder.length-1) zeige(seite+1); });
  function vorlesenSetzen(an){
    vorlesenAn=an; schreib('sj.wichtel.vorlesen', an);
    $('vorlesen').setAttribute('aria-pressed', String(an));
    $('vorlesen').textContent=an ? 'Vorlesen aus' : 'Bommi liest vor';
  }
  $('vorlesen').onclick=function(){
    vorlesenSetzen(!vorlesenAn);
    if(vorlesenAn){ messen('wichtel_read_aloud', {geschichte:nr}, 'vorlesen'); abspielen(); } else ton.pause();
  };
  $('zurueck').onclick=function(){ zeige(seite-1); };
  $('weiter').onclick=function(){ zeige(seite+1); };
  // Wischen
  var x0=null, y0=0;
  $('rahmen').addEventListener('touchstart', function(e){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
  $('rahmen').addEventListener('touchend', function(e){
    if(x0===null) return; var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) zeige(seite+(dx<0?1:-1));
  });
  document.addEventListener('keydown', function(e){ if($('s-bilder').hidden) return; if(e.key==='ArrowRight') zeige(seite+1); if(e.key==='ArrowLeft') zeige(seite-1); });

  // ---------- Laden ----------
  Promise.all([fetch('themen/wichtel/geschichten.json').then(function(r){ return r.json(); }), fetch('themen/wichtel/material.json').then(function(r){ return r.json(); })])
    .then(function(x){
      var G=x[0], M=x[1], wahl=lies('sj.wichtel'), zeilen=null;
      if(wahl && wahl.nr && WK.gueltig(wahl.erster) && WK.gueltig(wahl.letzter))
        zeilen=WK.plan(M, G, {nr:wahl.nr, szenario:wahl.szenario, erster:wahl.erster, letzter:wahl.letzter, sonntage:wahl.paket==='advent', eigene:wahl.eigene||{}}, heute()).zeilen;
      nr=WK.heutige(zeilen, heute(), new URLSearchParams(location.search).get('nr'));
      g=G.geschichten.filter(function(s){ return s.nr===nr; })[0] || G.geschichten[0]; nr=g.nr;
      m=WK.medien(nr);
      document.title=g.titel+' · Bommi';
      $('punkte').innerHTML=g.bilder.map(function(){ return '<span></span>'; }).join('');
      $('bommel').style.background=FARBE[String(g.bommel||'').toLowerCase()]||FARBE.rot;
      $('mitmachen').textContent=g.mitmachen||'';
      var satz=(G.regeln && G.regeln.geschichte_ende)||'Wo ein Bommel liegt, war ich da.';
      $('satz').textContent=satz;
      vorlesenSetzen(vorlesenAn);
      function los(){ $('s-schranke').hidden=true; if(new URLSearchParams(location.search).get('ab')==='bilder') bilderZeigen(); else videoZeigen(); }
      // Ab Geschichte 2: erst anmelden (UNICORN-144). Angemeldet: Plan im Hintergrund abgleichen.
      if(window.WichtelKonto && WichtelKonto.schranke(nr)){
        $('schranke-bild').src=WK.medien(1).bilder[0].bild;
        $('s-schranke').hidden=false; document.body.classList.add('bilder');
        $('anmelden').onclick=function(){ WichtelKonto.anmelden($('erinnern').checked, los); };
        return;
      }
      if(window.WichtelKonto) WichtelKonto.abgleichen();
      los();
    });
})();
</script>
</body>
</html>
