<title>Schatzweg · Schatzsuche zum Kindergeburtstag</title>
<script>
// Startadresse: alte Spiel-Links (#tour, #einrichten) ins Spiel, Eltern mit eigener Party in die App,
// alle anderen auf die Landingpage.
(function(){
  var h=location.hash, party=false;
  try{ for(var i=0;i<localStorage.length;i++){ if(/^sj\.party\./.test(localStorage.key(i))){ party=true; break; } } }catch(e){}
  location.replace(/^#(tour|einrichten)$/.test(h) ? 'app/spiel.html?thema=einhorn'+h : party ? 'app/'+(h||'') : 'app/landing.html'+location.search);
})();
</script>
