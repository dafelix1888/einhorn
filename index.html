<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zauberspiegel"><meta name="robots" content="noindex,nofollow">
<title>Funkels Zauberspiegel</title>
<style>
:root{--ground:#F1EEF8;--surface:#FFFFFF;--ink:#241A3D;--soft:#5A5073;--line:#D8D2E6;--magic:#6B35C9;--deep:#4E22A0;--danger:#B3262E;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:"Trebuchet MS","Avenir Next","Helvetica Neue",Arial,sans-serif;font-size:19px;line-height:1.45;display:grid;place-items:center;padding:24px 20px}
[hidden]{display:none!important}
.tor{width:100%;max-width:26rem;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.9rem;line-height:1.1}
p{margin:0;color:var(--soft)}
form{display:flex;flex-direction:column;gap:12px;margin-top:6px}
label{font-weight:700}
input[type=password]{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.merken{display:flex;align-items:center;gap:10px;font-weight:400;color:var(--soft)}
.merken input{width:22px;height:22px;accent-color:var(--magic)}
button{font:inherit;font-weight:800;font-size:1.2rem;border:0;border-radius:999px;padding:14px 26px;background:var(--magic);color:#fff;box-shadow:0 4px 0 var(--deep);cursor:pointer}
button:disabled{opacity:.6}
:focus-visible{outline:3px solid var(--magic);outline-offset:3px}
#fehler{color:var(--danger);font-weight:700}
</style></head><body>
<main class="tor" id="tor" hidden>
  <h1>Funkels Zauberspiegel</h1>
  <p>Der Spiegel öffnet sich nur mit dem Zauberwort.</p>
  <form id="f">
    <label for="pw">Zauberwort</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="merken" for="merken"><input type="checkbox" id="merken" checked> Auf diesem Gerät merken</label>
    <button type="submit" id="los">Öffnen</button>
    <p id="fehler" role="alert" hidden></p>
  </form>
</main>
